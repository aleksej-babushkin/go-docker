services:
  go:
    build: ./docker/go/${APP_ENV}
    container_name: ${APP_NAME}-go
    restart: always
    networks:
      - alekdevgo

  postgres:
    build: ./docker/postgres/${APP_ENV}
    container_name: ${APP_NAME}-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data/18
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - alekdevgo

volumes:
  postgres_data:

networks:
  alekdevgo:
    driver: bridge
